name: Documentation

on:
  workflow_call:
    inputs:
      deploy:
        description: Build and deploy the documentation to GitHub Pages.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build Sphinx documentation
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Materialize Git LFS files
        run: git lfs pull

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Generate API documentation
        run: >-
          python -m sphinx.ext.apidoc
          --force
          --output-dir docs/source
          src/factory_creator

      - name: Build documentation
        run: >-
          python -m sphinx
          -E
          -a
          -b html
          docs/source
          docs/build/html

      - name: Configure GitHub Pages
        if: inputs.deploy
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: inputs.deploy
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/build/html

  deploy:
    name: Deploy documentation
    if: inputs.deploy
    needs: build
    runs-on: ubuntu-latest

    permissions:
      actions: read
      pages: write
      id-token: write

    concurrency:
      group: github-pages
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
