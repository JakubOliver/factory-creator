name: Tests and documentation

on:
  push:
    paths:
      - "src/**"
      - "tests/**"
      - "data/**"
      - "docs/**"
      - "main.py"
      - "pyproject.toml"
      - ".github/workflows/docs.yml"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "data/**"
      - "docs/**"
      - "main.py"
      - "pyproject.toml"
      - ".github/workflows/docs.yml"
      - ".github/workflows/tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest --junitxml=report.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report-${{ matrix.os }}
          path: report.xml
          if-no-files-found: warn

  documentation:
    name: Sphinx documentation
    needs: pytest
    uses: ./.github/workflows/docs.yml
    with:
      deploy: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}

    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
