name: Benchmarks

run-name: Benchmarks for ${{ github.ref_name }} by @${{ github.actor }}

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  electric-mining-drill:
    name: Electric mining drill topological orderings
    runs-on: ubuntu-latest
    timeout-minutes: 65

    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Install project
        run: python -m pip install -e .

      - name: Run benchmark
        shell: bash
        timeout-minutes: 120
        run: |
          mkdir -p output
          python -m factory_creator.util.playground \
            electric-mining-drill-topological-orderings \
            2>&1 | tee output/electric-mining-drill-topological-orderings.log

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: electric-mining-drill-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/electric-mining-drill-topological-orderings.csv
            output/electric-mining-drill-topological-orderings.log
          if-no-files-found: warn
          retention-days: 365
