name: Benchmarks

run-name: Benchmarks for ${{ github.ref_name }} by @${{ github.actor }}

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  electric-mining-drill:
    name: Electric mining drill topological orderings
    runs-on: ubuntu-latest
    timeout-minutes: 120

    permissions:
      contents: write

    env:
      BENCHMARK_RELEASE_TAG: benchmark-results
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Install project
        run: python -m pip install -e .

      - name: Run benchmark
        shell: bash
        timeout-minutes: 120
        run: |
          mkdir -p output
          
          python -m factory_creator.util.playground \
            electric-mining-drill-topological-orderings \
            2>&1 | tee output/electric-mining-drill-topological-orderings.log

          python -m factory_creator.util.playground \
            retry-or-not-retry \
            2>&1 | tee output/retry-or-not-retry.log

      - name: Prepare release assets
        shell: bash
        run: |
          mkdir -p release-assets
          for csv_path in output/*.csv; do
            asset_name="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${csv_path##*/}"
            cp "$csv_path" "release-assets/$asset_name"
          done

      - name: Create or update benchmark release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$BENCHMARK_RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$BENCHMARK_RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --title "Benchmark results" \
              --notes "Persistent CSV outputs generated by benchmark workflows." \
              --prerelease \
              --latest=false
          fi
          gh release upload "$BENCHMARK_RELEASE_TAG" release-assets/*.csv

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: electric-mining-drill-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/*.csv
            output/electric-mining-drill-topological-orderings.log
            output/retry-or-not-retry.log
          if-no-files-found: warn
          retention-days: 90
