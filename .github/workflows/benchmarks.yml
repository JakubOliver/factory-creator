name: Benchmarks

run-name: Benchmarks for ${{ github.ref_name }} by @${{ github.actor }}

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: benchmark-results
  cancel-in-progress: false

jobs:
  benchmarks:
    name: Run benchmark scenarios
    runs-on: ubuntu-latest
    timeout-minutes: 330

    permissions:
      actions: read
      contents: write
      pages: write
      id-token: write

    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Run all benchmark scenarios
        shell: bash
        timeout-minutes: 300
        run: |
          mkdir -p output
          python -m factory_creator.util.playground --all \
            2>&1 | tee output/benchmarks.log

      - name: Upload raw benchmark results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmarks-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/*.csv
            output/benchmarks.log
          if-no-files-found: warn
          retention-days: 90

      - name: Ensure benchmark history branch exists
        shell: bash
        run: |
          if ! git ls-remote --exit-code --heads origin benchmark-results; then
            git push origin "${GITHUB_SHA}:refs/heads/benchmark-results"
          fi

      - name: Check out benchmark history
        uses: actions/checkout@v6
        with:
          ref: benchmark-results
          path: benchmark-history

      - name: Add run to benchmark history
        run: >-
          python -m factory_creator.util.playground.benchmark_site
          --results-directory output
          --history-directory benchmark-history/benchmarks

      - name: Save benchmark history
        shell: bash
        run: |
          git -C benchmark-history config user.name "github-actions[bot]"
          git -C benchmark-history config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C benchmark-history add benchmarks
          if ! git -C benchmark-history diff --cached --quiet; then
            git -C benchmark-history commit -m "Add benchmark run ${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            git -C benchmark-history push origin HEAD:benchmark-results
          fi

      - name: Generate API documentation
        run: python -m sphinx.ext.apidoc --force --output-dir docs/source src/factory_creator

      - name: Build documentation
        run: python -m sphinx -E -a -b html docs/source docs/build/html

      - name: Add benchmark history to documentation
        shell: bash
        run: |
          mkdir -p docs/build/html/benchmarks
          cp -R benchmark-history/benchmarks/. docs/build/html/benchmarks/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/build/html

  deploy:
    name: Deploy documentation and benchmark history
    needs: benchmarks
    runs-on: ubuntu-latest

    permissions:
      actions: read
      pages: write
      id-token: write

    concurrency:
      group: github-pages
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
