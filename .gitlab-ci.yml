image: python:3.14

default:
  before_script:
    - python -m pip install -r requirements_dev.txt

stages:
  - test
  - deploy

pytest:
  stage: test
  script:
    - python -m pytest --junitxml=report.xml
  artifacts:
    when: always
    reports:
      junit: report.xml

pages:
  stage: deploy
  rules:
    - when: never # Cannot find option for pages in gitlab, therefore no use of this stage
  script:
    - sphinx-build -b html docs/source public
  pages: true
  only:
  - master
